# Server Configuration
server.port=8080

# Application Name
spring.application.name=fx-exposure-management-platform

# ==============================================================================
# PostgreSQL Datasource Configuration
# Environment variables:
#   DB_URL      (default: jdbc:postgresql://localhost:5432/fx_exposure_db)
#   DB_USERNAME (default: postgres)
#   DB_PASSWORD (default: postgres)
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fx_exposure_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================================
# JPA / Hibernate Configuration
# ==============================================================================
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================================
# JWT Authentication Configuration
# Environment variables:
#   JWT_SECRET      (At least 256 bits for HMAC-SHA256 in production)
#   JWT_EXPIRATION  (Token expiration time in milliseconds, default 3600000 ms = 1 hour)
# WARNING: Do not hardcode a real production secret. Production must set JWT_SECRET.
# ==============================================================================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ==============================================================================
# OpenAPI / Swagger Documentation Endpoints
# Access UI at: http://localhost:8080/swagger-ui.html
# ==============================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
